name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste API keys, tokens or the contents of your `.env`, and do not attach a board you are not allowed to share. For a security problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally using a bundled sample board (`samples/nrf52840-node/` or `samples/patch-2g5/`).
      placeholder: |
        1. npm run dev
        2. Upload ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TrustPCB version
      description: The version in package.json, or a commit hash.
    validations:
      required: true
  - type: dropdown
    id: runner
    attributes:
      label: Runner
      options:
        - scripted (the default, no model)
        - muse_api
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, KiCad version (`kicad-cli --version`, or "not installed"), and whether Docker and the solver image are available.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Backend log lines, or the message shown in the app. Remove anything private first.
      render: text
