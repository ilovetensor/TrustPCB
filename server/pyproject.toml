[project]
name = "trustpcb-server"
version = "0.1.0"
description = "TrustPCB backend: board intake, review sessions, events and storage"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116.1,<1",
  "uvicorn>=0.35,<1",
  "python-multipart>=0.0.20",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "shapely>=2.1,<3",
  "h5py>=3.12,<4",
  "resvg-py>=0.5,<1",
  "httpx>=0.28,<1",
  "scikit-rf>=1.5,<2",
  "pypdf>=6,<7",
  "playwright>=1.64,<2",
  "scipy>=1.14,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-xdist>=3.6,<4",
  "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
  "slow: long-running tests (solver benchmarks, full pipelines); skipped by scripts/test-all.sh unless --slow is given", "default_image_mode: keep the runner default image mode"]

[tool.hatch.build.targets.wheel]
packages = ["trustpcb"]
